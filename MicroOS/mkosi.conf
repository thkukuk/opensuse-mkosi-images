[Distribution]
Distribution=opensuse
Release=tumbleweed

[Output]
OutputDirectory=mkosi.output
Format=none
ImageVersion=0.0

[Content]
Bootable=no # else mkosi will generate initrd
# Packages list is needed for OBS...
Packages=MicroOS-release
	MicroOS-release-appliance
        patterns-microos-basesystem
	patterns-microos-base-zypper
	patterns-microos-defaults
	patterns-microos-hardware
	patterns-microos-selinux
	patterns-containers-container_runtime
	patterns-images-hardware
	patterns-images-raspberrypi
	enable-no_new_privs
        live-add-yast-repos
	combustion
        jeos-firstboot
        kernel-default
	kernel-firmware-all
# bootloader
        dracut
        systemd-boot
        sdbootutil
        sdbootutil-snapper
        shim
        uefi_mbr
        mokutil
        efibootmgr
        update-bootloader
	systemd-repart-dracut
# FDE
        cryptsetup
        device-mapper
        disk-encryption-tool
        dracut-pcr-signature
        sdbootutil-enroll
        sdbootutil-jeos-firstboot-enroll
# Nice to have
	group(mail) # needed by useradd bsc#1061838
	#pam_pwquality
	#cracklib-dict-small # Avoid the big 10MiB one
	bash-completion
	dosfstools # For fscking ESP and XBOOTLDR partitions
	tar
	rsync
	run0-policy-wheel-auth-self
	system-group-wheel
	lsof # For zypper ps (bsc#1167553)
	qemu-guest-agent
	wget
	zypp-excludedocs
	zypp-no-multiversion
	zypp-no-recommends
