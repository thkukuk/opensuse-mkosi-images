[Distribution]
Distribution=opensuse
Release=tumbleweed

[Output]
OutputDirectory=mkosi.output
Format=none
ImageVersion=0.0

[Content]
Bootable=no # else mkosi will generate initrd
# Packages list is needed for OBS...
Packages=
	MicroOS-release
	MicroOS-release-appliance
	account-utils
	bash-completion
	combustion
	cryptsetup
	device-mapper
	disk-encryption-tool
	dosfstools
	dracut
	dracut-pcr-signature
	efibootmgr
	enable-no_new_privs
	group(mail)
	jeos-firstboot
	kernel-default
	kernel-firmware-all
	live-add-yast-repos
	lsof
	mokutil
	opensuse-mkosi-images-arch-deps
	patterns-base-hardware
	patterns-containers-container_runtime
	patterns-microos-base-zypper
	patterns-microos-basesystem
	patterns-microos-defaults
	patterns-microos-selinux
	qemu-guest-agent
	rdii-helper
	rsync
	run0-policy-wheel-auth-self
	sdbootutil
	sdbootutil-enroll
	sdbootutil-jeos-firstboot-enroll
	sdbootutil-snapper
	shim
	sndiff
	system-group-wheel
	systemd-boot
	systemd-repart-dracut
	tar
	uefi_mbr
	update-bootloader
	wget
	zypp-excludedocs
	zypp-no-multiversion
	zypp-no-recommends
	zypp-single-rpmtrans
