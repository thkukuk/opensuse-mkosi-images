[Content]
#RootPassword=linux
Ssh=no
WithRecommends=no
WithDocs=yes
Bootable=no
SELinuxRelabel=true
Packages=openSUSE-release
	openSUSE-release-appliance-custom
        patterns-base-base
	patterns-base-enhanced_base # openssh
        patterns-base-sw_management # zypper
	patterns-base-selinux
	patterns-base-hardware
	snapper-zypp-plugin
        live-add-yast-repos
	combustion
        curl
        jeos-firstboot
        kernel-default
	kernel-firmware-all
	mdadm
	rdii-helper
	systemd-repart-dracut
	zypp-no-recommends
# network
        iproute2
	iputils
        NetworkManager
# bootloader
        dracut
        systemd-boot
        sdbootutil
        sdbootutil-snapper
        shim
        uefi_mbr
        mokutil
        efibootmgr
	update-bootloader
# FDE
	cryptsetup
	device-mapper
	disk-encryption-tool
	dracut-pcr-signature
	sdbootutil-enroll
	sdbootutil-jeos-firstboot-enroll
# Recommends on Tumbleweed
	account-utils
	audit
	acl
	group(mail) # needed by useradd bsc#1061838
	vim-small
	pam_pwquality
	cracklib-dict-small # Avoid the big 10MiB one
	bash-completion
	#glibc-locale
	tar
	parted
	polkit-default-privs
	rsync
	dosfstools # For fscking ESP and XBOOTLDR partitions
	lsof # For zypper ps (bsc#1167553)
	less
	man
	qemu-guest-agent
	wget
	sndiff
	system-group-wheel
	zypper-needs-restarting # Some deployment script use this (bsc#1173548)
RemovePackages=
	live-add-yast-repos
# Removing them here would remove all dependencies, too
#	kernel-firmware-all
RemoveFiles=
	/var/lib/zypp
        /var/lib/systemd/random-seed
	/var/lib/ca-certificates
        /init
        /var/adm
        /var/cache
	/var/crash
	/var/lock
	/var/run
	/var/spool
	/var/opt
